  <rect width="1600" height="1000" fill="url(#aglow1)"/>
  <rect width="1600" height="1000" fill="url(#aglow2)"/>
  <!-- shield motif -->
  <g transform="translate(1140 300)" opacity="0.16" fill="none" stroke="#9d7bff" stroke-width="3">
    <path d="M0 -150 L150 -95 V40 C150 150 70 215 0 250 C-70 215 -150 150 -150 40 V-95 Z"/>
