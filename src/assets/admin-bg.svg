<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#141033"/>
      <stop offset="1" stop-color="#1c0f3a"/>
    </linearGradient>
    <radialGradient id="aglow1" cx="78%" cy="22%" r="55%">
      <stop offset="0" stop-color="#5f29c7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5f29c7" stop-opacity="0"/>
